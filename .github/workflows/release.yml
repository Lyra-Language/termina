name: Release

# A release is a tag: pushing `v0.4.1` builds Termina on each platform, runs its checks, and
# publishes a GitHub release of that name with an archive per platform (package.sh). Run by
# hand (Actions ▸ Release ▸ Run workflow), it builds and keeps the archives as the run's
# artifacts, publishing nothing — a dry run before tagging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      lyra_ref:
        description: "lyra branch, tag or commit to build with"
        default: main
      grammar_ref:
        description: "tree-sitter-lyra branch, tag or commit to build with"
        default: main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      # The SDK setup-go installs, not a module toolchain fetched behind it (lyra's CI says why).
      GOTOOLCHAIN: local
      # The oldest macOS the app runs on: clang, SDL3's CMake and the text libraries' read it.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      LYRA_REF: ${{ inputs.lyra_ref || 'main' }}
      GRAMMAR_REF: ${{ inputs.grammar_ref || 'main' }}
    steps:
      # Termina beside the compiler and its grammar, as the workspace has them: build.sh
      # finds lyrac at ../lyra/build/lyrac, and lyra's go.mod the grammar at
      # ../tree-sitter-lyra.
      - name: Checkout termina
        uses: actions/checkout@v7
        with:
          path: termina
      - name: Checkout lyra
        uses: actions/checkout@v7
        with:
          repository: Lyra-Language/lyra
          ref: ${{ env.LYRA_REF }}
          path: lyra
      - name: Checkout tree-sitter-lyra
        uses: actions/checkout@v7
        with:
          repository: Lyra-Language/tree-sitter-lyra
          ref: ${{ env.GRAMMAR_REF }}
          path: tree-sitter-lyra

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: lyra/go.mod
          cache-dependency-path: lyra/go.sum

      # SDL3's build needs the headers of every Linux video and audio system it supports
      # (it loads them at run time, so the archive needs none of them): SDL's
      # docs/README-linux.md, trimmed of what a terminal never touches.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          # Only Ubuntu's own repositories: a broken third-party index fails apt-get update
          # (lyra's CI, 09/09).
          sudo grep -rlE 'dl\.google\.com|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          # fonts-noto-cjk: Termina's CJK fallback, which the checks draw from; zsh, for the
          # checks of the command line at its prompt.
          sudo apt-get install -y clang cmake ninja-build pkg-config patchelf xz-utils zsh fonts-dejavu-core \
            fonts-noto-cjk \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev \
            libgbm-dev libdbus-1-dev libibus-1.0-dev libudev-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # FreeType and HarfBuzz, static, so the program carries them (`ui` draws text with them);
      # first on PKG_CONFIG_PATH, ahead of any the runner has.
      - name: Build SDL3, SDL3_image, FreeType and HarfBuzz
        run: |
          termina/tools/sdl3.sh "$RUNNER_TEMP/sdl3"
          # SDL3_image against that SDL3, static, its own decoders only (PNG, JPEG, SVG…).
          PKG_CONFIG_PATH="$RUNNER_TEMP/sdl3/lib/pkgconfig" termina/tools/sdl3_image.sh "$RUNNER_TEMP/image"
          termina/tools/textlibs.sh "$RUNNER_TEMP/text"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/image/lib/pkgconfig:$RUNNER_TEMP/text/lib/pkgconfig:$RUNNER_TEMP/sdl3/lib/pkgconfig" >> "$GITHUB_ENV"
          # The checks run the programs as built, before package.sh points them at their
          # own copy; a Mac's SDL3 is named by its full path, Linux's needs telling.
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sdl3/lib" >> "$GITHUB_ENV"

      # lyrac, lui and the bindings' C halves `ui` links (lyrafmt is skipped without the
      # tree-sitter runtime, which a release does not need).
      - name: Build lyra
        working-directory: lyra
        run: |
          # The grammar's Go binding `#include`s its parser.c, which Go's build cache does
          # not hash: a cache setup-go restores keeps the parser it was built with, and a
          # grammar change since is a syntax error in lyra's own bindings (v0.2.0's first
          # run, at `pub extern`). lyra's CI clears it for the same reason.
          go clean -cache
          ./build.sh

      - name: Build Termina
        working-directory: termina
        run: ./build.sh

      # Ubuntu's global zshrc runs compinit, which stops before the first prompt to ask about
      # a directory on fpath that others may write or another user owns — as the image's are —
      # and the zsh checks see no prompt. The directories made root's and closed, as a
      # machine's own are.
      - name: Secure zsh's function directories (Linux)
        if: runner.os == 'Linux'
        run: |
          zsh -fc 'autoload -U compaudit; compaudit' 2>/dev/null | while IFS= read -r dir; do
            echo "securing $dir: $(stat -c '%U %A' "$dir")"
            sudo chown root:root "$dir" && sudo chmod go-w "$dir"
          done
          zsh -fc 'autoload -U compaudit; compaudit'

      - name: Check Termina
        working-directory: termina
        run: |
          build/vttest
          tools/check.sh

      # The Developer ID certificate into a keychain of the job's own, and the App Store
      # Connect key into a file, for package.sh to sign and notarize with. Without the
      # secrets (a fork, or before they are added) the app is signed ad hoc, and a tag says
      # so in a warning and the release notes.
      - name: Set up signing (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::warning::no MACOS_CERTIFICATE_P12 secret: the app is signed ad hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          # Apple's intermediates, which a runner may lack: without the one that issued the
          # certificate, its chain cannot be built and the identity is not valid. Public
          # certificates, kept in .github/certificates (the original and G2).
          for ca in termina/.github/certificates/*.pem; do
            security import "$ca" -k "$keychain" -t cert
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            # Every identity, valid or not, with macOS's reason for each it refuses.
            security find-identity -p codesigning "$keychain"
            echo "::error::MACOS_CERTIFICATE_P12 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "TERMINA_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -z "$NOTARY_KEY_P8" ]; then
            echo "::warning::no NOTARY_KEY_P8 secret: the app is signed but not notarized"
            exit 0
          fi
          printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          {
            echo "TERMINA_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "TERMINA_NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "TERMINA_NOTARY_ISSUER=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      # `bash`, not the default `bash -e`: with pipefail, a package.sh that fails fails the
      # step, though its output goes through tee — without, a Linux archive was never made
      # and the run passed.
      - name: Package
        working-directory: termina
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-$(git rev-parse --short HEAD)"
          fi
          # On Linux an AppImage too, beside the archive (tools/appimagetool.sh's pins).
          if [ "$RUNNER_OS" = Linux ]; then export TERMINA_APPIMAGE=1; fi
          ./package.sh "$version" | tee "$RUNNER_TEMP/package.log"
          # package.sh's last line says how the Mac app was signed: `(notarized)`, …
          signed="$(tail -1 "$RUNNER_TEMP/package.log" | sed -n 's/.*(\(.*\))$/\1/p')"
          {
            echo "${{ matrix.name }}: termina $(git rev-parse --short HEAD)," \
              "lyra $(git -C ../lyra rev-parse --short HEAD)," \
              "tree-sitter-lyra $(git -C ../tree-sitter-lyra rev-parse --short HEAD)" \
              "${signed:+— $signed}"
          } > build/release/built-with-${{ matrix.name }}.txt

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Keep the archive
        uses: actions/upload-artifact@v7
        with:
          name: termina-${{ matrix.name }}
          path: termina/build/release/*
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fetch the archives
        uses: actions/download-artifact@v7
        with:
          path: archives
          merge-multiple: true

      # The notes say what each archive was built from, lyra's commits among them, since a
      # tag of Termina pins nothing of the compiler's.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built from:"
            echo
            for f in archives/built-with-*.txt; do echo "- $(cat "$f")"; done
            echo
            if grep -q 'macos.*— notarized' archives/built-with-*.txt; then
              echo "The Mac app is signed with a Developer ID and notarized by Apple."
            else
              echo "The Mac app is not notarized, so macOS refuses it the first time: open it,"
              echo "then choose Open Anyway in System Settings ▸ Privacy & Security, and open it"
              echo "again. (Since macOS 15, right-click ▸ Open no longer gets past Gatekeeper.)"
            fi
            echo "On Linux, make the AppImage executable and run it"
            echo "(\`chmod +x Termina-*.AppImage && ./Termina-*.AppImage\`), or unpack the"
            echo "archive and run \`./termina\`."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Termina ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            archives/*.zip archives/*.tar.gz archives/*.AppImage
