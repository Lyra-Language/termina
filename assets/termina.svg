<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Termina's icon: a prompt and its cursor, and a star of Lyra's. The body sits on macOS's
       icon grid (824 square, 100 in from each edge); the colors are the default theme's. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2F37"/>
      <stop offset="1" stop-color="#15171B"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E1AE"/>
      <stop offset="1" stop-color="#E5B967"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2D49B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F2D49B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
  <!-- The prompt. -->
  <path d="M272 412 L432 532 L272 652" fill="none" stroke="#E6E1DC" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The cursor, in the theme's blue. -->
  <rect x="486" y="612" width="212" height="58" rx="29" fill="#61AFEF"/>
  <!-- The star, with a soft glow. -->
  <circle cx="724" cy="318" r="150" fill="url(#glow)"/>
  <path d="M724 212 C734 286 756 308 830 318 C756 328 734 350 724 424 C714 350 692 328 618 318 C692 308 714 286 724 212 Z" fill="url(#star)"/>
</svg>
